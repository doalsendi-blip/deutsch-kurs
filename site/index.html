<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch für den Beruf · A1→A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f6f2ea; --card:#fffdf8; --ink:#1d1b18; --muted:#6b655c; --line:#e3dccf;
  --accent:#1f5f55; --accent-soft:#dcebe7; --warn:#a14a1a; --warn-soft:#f6e6da;
  --der:#2357a8; --die:#b3262f; --das:#2b7a3d; --pl:#7a4ea8;
  --ok:#2b7a3d; --bad:#b3262f; --ok-bg:#e3f1e5; --bad-bg:#f8e1e1; --mid:#a86a00; --mid-bg:#fbefd6;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181a; --card:#1f2225; --ink:#ece8e1; --muted:#a19b91; --line:#33373b;
    --accent:#6cc2b1; --accent-soft:#1f3632; --warn:#e39a6e; --warn-soft:#3a2a20;
    --der:#7fa8ef; --die:#f08a90; --das:#7fcf8e; --pl:#c4a2ec;
    --ok:#7fcf8e; --bad:#f08a90; --ok-bg:#1e3324; --bad-bg:#3a2224; --mid:#e8b75a; --mid-bg:#3a2f1a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:700;line-height:1.2;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-bottom:0;display:flex;align-items:center;gap:10px;min-height:56px}
.brand{font-family:"Fraunces",serif;font-weight:700;font-size:17px;flex:1;min-width:0}
.brand small{display:block;font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px}
nav.tabs a{text-decoration:none;color:var(--muted);padding:6px 9px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
.hero{padding:26px 0 6px}
.hero h1{font-size:30px}
.hero p{color:var(--muted);margin:8px 0 0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.units{display:grid;gap:10px;margin-top:12px}
.unit{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.unit .num{font-family:"Fraunces",serif;font-size:22px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.unit.locked{opacity:.72}
.unit.locked .num{background:var(--line);color:var(--muted)}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block}
.unit .t span{font-size:13px;color:var(--muted)}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.a1{background:var(--accent-soft);color:var(--accent)}
.pill.a2{background:var(--warn-soft);color:var(--warn)}
.mini{width:56px}
.sec-h{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 4px}
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.method div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.method b{display:block;font-size:14px}
.chips{position:sticky;top:57px;z-index:10;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink);background:var(--card)}
.chips a.done{border-color:var(--accent);color:var(--accent)}
.chips a.done::after{content:" ✓"}
section.block{scroll-margin-top:110px}
section.block>h2{font-size:22px;margin:30px 0 4px;display:flex;align-items:baseline;gap:10px}
section.block>h2 .k{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:2px 0 0;font-size:15px}
.goals{margin:8px 0 0;padding-left:20px}
.goals li{margin:3px 0}
.g-m{color:var(--der)} .g-f{color:var(--die)} .g-n{color:var(--das)} .g-p{color:var(--pl)}
/* bridge */
.cog{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cog button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.cog button b{font-weight:500}
.cog button span{font-size:12px;color:var(--muted)}
.rule h3{font-size:18px}
.rule .how{font-size:14px;color:var(--muted);margin:4px 0 10px}
.pair{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.pair:last-child{border-bottom:none}
.pair .en{flex:1;color:var(--muted)}
.pair .ar{color:var(--muted)}
.pair .de{flex:1.2;font-weight:500}
.pair .de.hidden{color:transparent;background:var(--line);border-radius:6px;cursor:pointer;user-select:none}
.pair .de.hidden::before{content:"tap to reveal";color:var(--muted);font-size:12px;font-weight:400;padding:0 8px}
.sub{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
table.snd{border-collapse:collapse;width:100%;font-size:14px}
table.snd td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
table.snd td:first-child{font-family:"IBM Plex Mono",monospace;font-weight:500;white-space:nowrap}
/* flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.fc{width:100%;min-height:170px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;user-select:none;position:relative;cursor:pointer}
.fc .w{font-family:"Fraunces",serif;font-size:28px;font-weight:500}
.fc .tr{font-size:17px;color:var(--muted);margin-top:8px;min-height:24px}
.fc .note{font-size:13px;color:var(--muted);margin-top:6px}
.fc .hint{position:absolute;bottom:8px;font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0f1a18}}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.legend{display:flex;gap:12px;font-size:13px;flex-wrap:wrap;color:var(--muted);margin-top:4px}
.vlist{display:none;margin-top:10px;width:100%}
.vlist.on{display:block}
.vrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow .d{flex:1;font-weight:500}
.vrow .e{flex:1;color:var(--muted);font-size:14px}
.spk{border:none;background:transparent;font-size:17px;padding:4px 6px;line-height:1;border-radius:8px;flex:none}
.spk:hover{background:var(--line)}
.spk.playing{background:var(--accent-soft)}
/* dialog */
.line{display:flex;gap:10px;padding:10px 6px;border-bottom:1px dashed var(--line);border-radius:8px}
.line:last-of-type{border-bottom:none}
.line.now{background:var(--accent-soft)}
.who{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.who.b{background:var(--warn-soft);color:var(--warn)}
.line .txt{flex:1}
.line .en{font-size:14px;color:var(--muted);display:none;margin-top:2px}
.show-en .line .en{display:block}
.hide-de .line .txt>div:first-child{filter:blur(5px)}
/* listening */
.player{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.player .big{width:48px;height:48px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:18px;flex:none}
@media (prefers-color-scheme: dark){.player .big{color:#0f1a18}}
.player .meta{flex:1;font-size:14px}
.transcript{display:none;margin-top:10px;font-size:15px;border-left:3px solid var(--accent);padding:6px 12px}
.transcript.on{display:block}
.diff{margin-top:6px;font-size:15px;line-height:1.9}
.diff span{padding:1px 4px;border-radius:5px;margin-right:2px}
.diff .w-ok{background:var(--ok-bg);color:var(--ok)}
.diff .w-case{background:var(--mid-bg);color:var(--mid)}
.diff .w-bad{background:var(--bad-bg);color:var(--bad)}
.diff .w-miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline dotted}
/* grammar */
.gram h3{font-size:17px;margin:4px 0 6px}
.gram p{margin:6px 0}
table.tb{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.tb th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.slots{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.slots span{padding:4px 8px;border-radius:8px;background:var(--line);font-size:14px}
.slots span.v{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.slots span.v{color:#0f1a18}}
.tip{border-left:3px solid var(--warn);padding:6px 12px;margin:10px 0;font-size:14px}
.tip b{color:var(--warn)}
/* exercises */
.ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-h h3{font-size:17px}
.score{font-size:13px;color:var(--muted);white-space:nowrap}
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q .p{font-weight:500;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);padding:9px 10px;border-radius:10px;text-align:left;font-size:15px}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.why{font-size:14px;color:var(--muted);margin-top:8px;display:none}
.why.on{display:block}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.tx{flex:1;min-width:140px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input.tx.right{border-color:var(--ok);background:var(--ok-bg)}
input.tx.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:14px;margin-top:6px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.uml{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.uml button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 11px;font-size:15px;min-width:36px}
.tray,.answer{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border-radius:10px}
.answer{border:1px dashed var(--line);margin-bottom:8px;background:var(--bg)}
.answer.right{border-color:var(--ok);border-style:solid;background:var(--ok-bg)}
.answer.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-bg)}
.tok{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:8px;font-size:15px}
.tok.used{visibility:hidden}
/* think */
.step{padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .en{font-weight:500}
.step .num{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.step .ans{display:none;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.step .ans.on{display:flex;gap:8px;align-items:flex-start}
.step .ans .de{flex:1;font-weight:600;color:var(--accent)}
.step .ans .de small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
/* typing */
.target{font-family:"IBM Plex Mono",monospace;font-size:19px;line-height:1.7;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);word-break:break-word;letter-spacing:.01em}
.target .c-ok{color:var(--ok)}
.target .c-bad{background:var(--bad-bg);color:var(--bad)}
.target .c-cur{border-bottom:2px solid var(--accent)}
.target .c-todo{color:var(--muted)}
input.typing{width:100%;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:18px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.stats{display:flex;gap:16px;font-size:14px;margin-top:10px;color:var(--muted)}
.stats b{color:var(--ink);font-size:18px;font-family:"Fraunces",serif}
details.keys{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}
details.keys summary{cursor:pointer;font-weight:500}
details.keys p{margin:6px 0;font-size:14px}
kbd{font-family:"IBM Plex Mono",monospace;font-size:13px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--bg)}
/* write */
textarea{width:100%;min-height:150px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.model{display:none;white-space:pre-line;border-left:3px solid var(--accent);padding:8px 12px;margin-top:10px;font-size:15px}
.model.on{display:block}
.copybox{display:none;margin-top:10px;font-size:13px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;user-select:all}
.copybox.on{display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
ul.clean{padding-left:20px;margin:6px 0}
ul.clean li{margin:4px 0}
.examgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.examgrid .card{margin:0}
.examgrid h3{font-size:18px}
.examgrid .big{font-family:"Fraunces",serif;font-size:26px}
.back{display:inline-block;margin-top:18px;font-size:14px;text-decoration:none}
.boxes{display:flex;gap:6px;margin-top:10px}
.boxes div{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:12px;color:var(--muted);background:var(--card)}
.boxes div b{display:block;font-size:18px;color:var(--ink);font-family:"Fraunces",serif}
@media (max-width:440px){.opts{grid-template-columns:1fr}.hero h1{font-size:26px}nav.tabs a{padding:6px 7px;font-size:12px}.brand small{display:none}.brand{font-size:15px}.method{grid-template-columns:1fr 1fr}.examgrid{grid-template-columns:1fr}}

/* ---- guided path ---- */
.next{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:18px;margin:16px 0;display:block;text-decoration:none}
.next .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.next h2{font-size:24px;margin:6px 0 4px;color:var(--bg)}
.next p{margin:0;opacity:.85;font-size:14px}
.next .go{display:inline-block;margin-top:12px;background:var(--bg);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;font-size:15px}
.next.warn{background:var(--warn)}
.how ol{margin:6px 0 0;padding-left:20px}
.how li{margin:5px 0;font-size:15px}
.steps{display:grid;gap:8px;margin-top:10px}
.srow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:inherit}
.srow .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--line);color:var(--muted);flex:none}
.srow.pass .n{background:var(--ok);color:#fff}
.srow.fail .n{background:var(--bad);color:#fff}
.srow.cur{border-color:var(--ink);border-width:2px}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-size:15px}
.srow .t span{font-size:12px;color:var(--muted)}
.srow .g{font-size:13px;text-align:right;white-space:nowrap}
.srow .g b{display:block;font-family:"Fraunces",Georgia,serif;font-size:17px}
.task{border:2px solid var(--ink);border-radius:var(--radius);padding:14px 16px;margin:14px 0;background:var(--card)}
.task .h{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.task ol{margin:6px 0 8px;padding-left:20px}
.task li{margin:4px 0}
.passline{font-size:14px;padding-top:8px;border-top:1px solid var(--line)}
.passline b{color:var(--accent)}
.result{border-radius:var(--radius);padding:16px;margin:18px 0;border:2px solid}
.result.ok{border-color:var(--ok);background:var(--ok-bg)}
.result.no{border-color:var(--bad);background:var(--bad-bg)}
.result .big{font-family:"Fraunces",Georgia,serif;font-size:34px;line-height:1}
.result p{margin:8px 0 0}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--muted)}
.prog{display:flex;gap:3px;margin-top:8px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.pass{background:var(--ok)} .prog i.fail{background:var(--bad)} .prog i.cur{background:var(--ink)}
table.grades{border-collapse:collapse;width:100%;font-size:14px}
table.grades td,table.grades th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.grades th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.grades td.r{text-align:right;white-space:nowrap}
.ok-t{color:var(--ok);font-weight:600} .no-t{color:var(--bad);font-weight:600}
.lockmsg{font-size:13px;color:var(--muted)}
input.score{width:80px;font:inherit;font-size:18px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center}
.selfgrade{display:none;gap:8px;margin-top:8px;align-items:center;font-size:14px}
.selfgrade.on{display:flex}
.chk{font-size:12px;font-weight:600}

/* ---- game layer ---- */
.hud{display:flex;gap:8px;align-items:stretch;margin:8px 0 4px}
.hud .hb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;font-size:12px;color:var(--muted);min-width:64px}
.hud .hb.grow{flex:1}
.hud .big{font-family:"Fraunces",Georgia,serif;font-size:18px;color:var(--ink);font-weight:700}
.hud .goalrow{display:flex;justify-content:space-between;margin-bottom:5px}
.hud .goalrow b{color:var(--ink)}
.xpfloat{position:fixed;right:18px;top:70px;background:var(--accent);color:#fff;font-weight:700;padding:5px 10px;border-radius:99px;font-size:14px;z-index:60;animation:xpup 1.1s ease-out forwards;pointer-events:none}
@keyframes xpup{0%{opacity:0;transform:translateY(10px)}20%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-24px)}}
#combo{position:fixed;left:50%;top:64px;transform:translateX(-50%) scale(.9);background:var(--warn);color:#fff;font-weight:700;padding:6px 14px;border-radius:99px;opacity:0;transition:all .2s;z-index:60;pointer-events:none}
#combo.on{opacity:1;transform:translateX(-50%) scale(1)}
.stars{color:#e0a000;font-size:22px;letter-spacing:2px}
.stars.sm{font-size:12px;letter-spacing:0;display:block}
.gamecard{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.gamecard h3{font-size:18px}
.gamecard p{margin:4px 0;font-size:14px;color:var(--muted)}
.game{margin-top:12px}
.gtop{display:flex;justify-content:space-between;font-weight:600;font-size:16px;padding:10px 4px}
.bzcard{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:30px 16px;text-align:center;transition:all .15s}
.bzcard.ok{border-color:var(--ok);background:var(--ok-bg)} .bzcard.no{border-color:var(--bad);background:var(--bad-bg)}
.bzw{font-family:"Fraunces",Georgia,serif;font-size:36px;font-weight:700}
.bzen{color:var(--muted);margin-top:6px}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.art{font-size:22px;font-weight:700;padding:18px 0;border-radius:14px;border:2px solid currentColor;background:var(--card)}
.art:disabled{opacity:.4}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{min-height:68px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;padding:6px;font-weight:500}
.pc.de{border-left:4px solid var(--accent)}
.pc.sel{border-color:var(--ink);border-width:2px;background:var(--accent-soft)}
.pc.done{visibility:hidden}
.pc.bad{background:var(--bad-bg);border-color:var(--bad)}
/* ---- story ---- */
.story .st-t{font-size:28px;margin-top:4px}
.sent{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:9px 6px;border-radius:10px;font-size:18px;line-height:1.55}
.sent.now{background:var(--accent-soft)}
.sent .sbtn{display:flex;gap:2px;align-items:flex-start}
.sent .enb{border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:11px;font-weight:600;padding:3px 6px;color:var(--muted)}
.sent .en{grid-column:1/-1;display:none;font-size:14px;color:var(--muted)}
.sent.showen .en,.allen .sent .en{display:block}
.gw{font:inherit;color:inherit;background:none;border:none;padding:0;border-bottom:2px dotted var(--accent);cursor:pointer;line-height:1.2}
#stBody{position:relative}
.story{position:relative}
.gpop{position:absolute;display:none;background:var(--ink);color:var(--bg);padding:7px 11px;border-radius:9px;font-size:14px;z-index:15;max-width:220px}
.gpop.on{display:block}
.tfq{font-size:18px;font-weight:500;margin:6px 0 10px}
.setrow{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.setrow label{width:60px;color:var(--muted)}
.setrow select{flex:1;font:inherit;font-size:14px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.setrow input[type=range]{flex:1}
@media (max-width:440px){.brand{display:none}nav.tabs{flex:1;justify-content:space-between}nav.tabs a{padding:6px 8px;font-size:13px}}

<script>
const UNITS = [{"id": 1, "level": "A1", "full": true, "title": "Sich im Beruf vorstellen", "en": "Introducing yourself at work", "goals": ["Recognize the large share of work vocabulary you already know from English", "Say your name, where you're from, where you live, and what you do", "Ask a colleague the same questions — formally (Sie) and informally (du)"], "bruecke": {"intro": "German and English are sister languages. Much of your work vocabulary is already German, and much of the rest follows a few regular sound shifts. Learn a shift once and you can work out hundreds of words without memorizing them.", "showSounds": true, "cognates": [{"de": "das Team", "en": "team", "g": "n"}, {"de": "die Firma", "en": "firm, company", "g": "f"}, {"de": "der Analyst", "en": "analyst", "g": "m"}, {"de": "die Analyse", "en": "analysis", "g": "f"}, {"de": "das Projekt", "en": "project", "g": "n"}, {"de": "die Strategie", "en": "strategy", "g": "f"}, {"de": "die Daten", "en": "data", "g": "p"}, {"de": "das Budget", "en": "budget", "g": "n"}, {"de": "die Bank", "en": "bank", "g": "f"}, {"de": "die Finanzen", "en": "finances", "g": "p"}, {"de": "der Manager", "en": "manager", "g": "m"}, {"de": "das Marketing", "en": "marketing", "g": "n"}], "rules": [{"title": "-tion stays -tion", "how": "Same ending, always feminine (die), stressed on the last syllable: 'tsee-OHN'. A c before it usually becomes k.", "ex": [["information", "die Information"], ["organization", "die Organisation"], ["presentation", "die Präsentation"]], "guess": [["position", "die Position"], ["option", "die Option"], ["function", "die Funktion"]]}, {"title": "English th → German d", "how": "German never has the 'th' sound. Where English has th, German usually has d.", "ex": [["thank (you)", "danke"], ["three", "drei"], ["thing", "das Ding"]], "guess": [["to think", "denken"], ["brother", "der Bruder"], ["thick", "dick"]]}], "extraTitle": "False friends: look English, mean something else", "extra": [{"de": "der Chef", "en": "the boss — not a cook (cook = der Koch)"}, {"de": "das Handy", "en": "cell phone"}, {"de": "bekommen", "en": "to get, receive — not 'become' (become = werden)"}, {"de": "also", "en": "so, therefore — not 'also' (also = auch)"}, {"de": "aktuell", "en": "current — not 'actual' (actual = tatsächlich)"}]}, "vocab": [{"de": "der Name", "en": "name", "g": "m"}, {"de": "der Beruf", "en": "job, profession", "g": "m"}, {"de": "die Firma", "en": "company", "g": "f", "note": "Plural: die Firmen"}, {"de": "die Abteilung", "en": "department", "g": "f"}, {"de": "die Finanzabteilung", "en": "finance department", "g": "f"}, {"de": "der Kollege / die Kollegin", "en": "colleague (m / f)", "g": "m"}, {"de": "der Chef / die Chefin", "en": "boss (m / f)", "g": "m"}, {"de": "das Team", "en": "team", "g": "n"}, {"de": "die Datenanalyse", "en": "data analysis", "g": "f"}, {"de": "arbeiten bei", "en": "to work at (a company)", "g": "v", "note": "Ich arbeite bei einer Bank."}, {"de": "wohnen in", "en": "to live in", "g": "v"}, {"de": "kommen aus", "en": "to come from", "g": "v"}, {"de": "leiten", "en": "to lead, to manage", "g": "v", "note": "Ich leite ein Team."}, {"de": "Was machen Sie beruflich?", "en": "What do you do for a living?", "g": "x"}, {"de": "Freut mich!", "en": "Nice to meet you!", "g": "x"}, {"de": "Herzlich willkommen!", "en": "Welcome!", "g": "x"}, {"de": "ein bisschen", "en": "a little", "g": "x"}], "dialog": {"title": "Der erste Tag", "en": "David Miller meets a colleague on his first day in the finance department.", "lines": [{"s": "W", "de": "Guten Morgen! Ich bin Thomas Weber aus der Finanzabteilung.", "en": "Good morning! I'm Thomas Weber from the finance department."}, {"s": "M", "de": "Guten Morgen, Herr Weber. Mein Name ist David Miller. Freut mich!", "en": "Good morning, Mr. Weber. My name is David Miller. Nice to meet you!"}, {"s": "W", "de": "Freut mich auch. Woher kommen Sie, Herr Miller?", "en": "Nice to meet you too. Where are you from, Mr. Miller?"}, {"s": "M", "de": "Ich komme aus den USA, aus Chicago. Und Sie?", "en": "I'm from the USA, from Chicago. And you?"}, {"s": "W", "de": "Ich komme aus Hamburg, aber ich wohne jetzt in Frankfurt. Was machen Sie beruflich?", "en": "I'm from Hamburg, but I live in Frankfurt now. What do you do for a living?"}, {"s": "M", "de": "Ich bin Analyst. Ich leite ein Team für Datenanalyse.", "en": "I'm an analyst. I lead a data analysis team."}, {"s": "W", "de": "Interessant! Sprechen Sie Deutsch?", "en": "Interesting! Do you speak German?"}, {"s": "M", "de": "Ein bisschen. Ich lerne Deutsch.", "en": "A little. I'm learning German."}, {"s": "W", "de": "Sehr gut! Herzlich willkommen im Team!", "en": "Very good! Welcome to the team!"}, {"s": "M", "de": "Vielen Dank!", "en": "Thank you very much!"}]}, "hoeren": {"intro": "Goethe Hören style: a phone message. Listen twice before you look at the questions — that's how the exam does it.", "voice": "W", "text": "Hallo Herr Miller, hier ist Thomas Weber aus der Finanzabteilung. Herzlich willkommen in der Firma! Unser Team-Meeting ist am Montag. Bitte kommen Sie zuerst in mein Büro, Zimmer zwölf. Bis Montag!", "qs": [{"q": "Who is calling?", "o": ["A colleague from finance", "Someone from IT", "His boss"], "a": 0}, {"q": "When is the team meeting?", "o": ["Tuesday", "Monday", "Friday"], "a": 1}, {"q": "Where should he go first?", "o": ["Room 20", "Reception", "Room 12"], "a": 2}], "diktat": ["Ich heiße David Miller.", "Ich komme aus Chicago.", "Was machen Sie beruflich?", "Ich arbeite in der Finanzabteilung."]}, "denken": [{"en": "I am", "de": "Ich bin.", "note": "sein (to be): ich bin."}, {"en": "I'm an analyst.", "de": "Ich bin Analyst.", "note": "No 'a/an' with professions."}, {"en": "I work.", "de": "Ich arbeite.", "note": "ich → verb ends in -e."}, {"en": "I work here.", "de": "Ich arbeite hier."}, {"en": "I work at a bank.", "de": "Ich arbeite bei einer Bank.", "note": "'bei einer' = at a (company). Take it as a chunk for now."}, {"en": "Where do you work? (formal)", "de": "Wo arbeiten Sie?", "note": "English 'do' disappears. The verb goes straight to position 2."}, {"en": "Do you work here? (formal)", "de": "Arbeiten Sie hier?", "note": "Yes/no question: the verb comes first."}, {"en": "I live in Chicago, but I work in Frankfurt.", "de": "Ich wohne in Chicago, aber ich arbeite in Frankfurt.", "note": "aber (but) doesn't change word order."}], "grammar": [{"h": "1 · The verb is always in position 2", "html": "<p>In a statement and in a W-question, the conjugated verb sits in slot 2. In a yes/no question, it moves to slot 1.</p>\n     <div class=\"slots\"><span>Ich</span><span class=\"v\">arbeite</span><span>bei einer Bank.</span></div>\n     <div class=\"slots\"><span>Wo</span><span class=\"v\">arbeiten</span><span>Sie?</span></div>\n     <div class=\"slots\"><span class=\"v\">Arbeiten</span><span>Sie hier?</span></div>\n     <p class=\"small muted\">W-words: <b>wie</b> (how), <b>was</b> (what), <b>wo</b> (where), <b>woher</b> (where from), <b>wer</b> (who). Notice the w → 'wh' match with English.</p>"}, {"h": "2 · Present tense: the four verbs of this unit", "html": "<table class=\"tb\"><tr><th></th><th>sein</th><th>heißen</th><th>arbeiten</th><th>wohnen</th></tr>\n     <tr><td>ich</td><td>bin</td><td>heiße</td><td>arbeite</td><td>wohne</td></tr>\n     <tr><td>du</td><td>bist</td><td>heißt</td><td>arbeitest</td><td>wohnst</td></tr>\n     <tr><td>er / sie / es</td><td>ist</td><td>heißt</td><td>arbeitet</td><td>wohnt</td></tr>\n     <tr><td>wir</td><td>sind</td><td>heißen</td><td>arbeiten</td><td>wohnen</td></tr>\n     <tr><td>ihr</td><td>seid</td><td>heißt</td><td>arbeitet</td><td>wohnt</td></tr>\n     <tr><td>sie / Sie</td><td>sind</td><td>heißen</td><td>arbeiten</td><td>wohnen</td></tr></table>\n     <p class=\"small\">Stems ending in <b>-t</b> or <b>-d</b> add an <b>-e-</b>: du arbeit<b>e</b>st, er arbeit<b>e</b>t. Stems ending in <b>-ß/-s</b> drop the extra s: du hei<b>ßt</b>.</p>"}, {"h": "3 · Sie or du?", "html": "<p>At work, default to <b>Sie</b> + <b>Herr/Frau</b> + surname. Wait until a colleague offers <i>du</i> (often: „Wollen wir uns duzen?\"). In startups and tech teams, <i>du</i> from day one is common — follow their lead.</p>\n     <p><b>Sie</b> (formal \"you\") is always capitalized and uses the same verb form as <i>wir</i>: <i>Sie arbeiten</i>.</p>"}, {"h": "4 · No article with professions", "html": "<p>Ich bin Analyst. — not <s>ein Analyst</s>. Female forms usually add <b>-in</b>: Analyst<b>in</b>, Kolleg<b>in</b>, Chef<b>in</b>.</p>"}], "mc": [{"q": "___ heißen Sie?", "o": ["Wie", "Wo", "Woher", "Was"], "a": 0, "why": "Wie heißen Sie? = What's your name? (literally: how are you called?)"}, {"q": "Woher ___ Sie?", "o": ["kommt", "kommen", "kommst", "komme"], "a": 1, "why": "Formal Sie takes the same form as wir: Sie kommen."}, {"q": "Ich ___ Analyst.", "o": ["ist", "bist", "bin", "sind"], "a": 2, "why": "sein → ich bin."}, {"q": "Anna ___ in Frankfurt. (works)", "o": ["arbeitet", "arbeit", "arbeitest", "arbeiten"], "a": 0, "why": "er/sie/es + arbeiten → arbeitet (extra -e- after the t)."}, {"q": "Your new boss asks how you are. You reply and ask back:", "o": ["Gut, danke. Und dir?", "Gut, danke. Und Ihnen?"], "a": 1, "why": "With your boss (Sie), the formal form is Ihnen."}, {"q": "„Der Chef“ is…", "o": ["the cook", "the boss", "the chief analyst"], "a": 1, "why": "False friend: der Chef = the boss. A cook is der Koch."}], "gaps": [{"q": "Ich ____ in Chicago. (wohnen)", "a": ["wohne"]}, {"q": "Wo ____ du? (arbeiten)", "a": ["arbeitest"]}, {"q": "Wir ____ Kollegen. (sein)", "a": ["sind"]}, {"q": "Er ____ Thomas. (heißen)", "a": ["heißt"]}, {"q": "____ kommen Sie? – Aus Hamburg.", "a": ["Woher"]}], "builder": [{"w": ["Ich", "arbeite", "bei", "einer", "Bank."], "a": ["Ich arbeite bei einer Bank."], "en": "I work at a bank."}, {"w": ["Was", "machen", "Sie", "beruflich?"], "a": ["Was machen Sie beruflich?"], "en": "What do you do for a living?"}, {"w": ["Ich", "leite", "ein", "Team."], "a": ["Ich leite ein Team."], "en": "I lead a team."}], "tippen": ["Männer, schön, für, heißen. Österreich, Übung, Ärger.", "Ich heiße David Miller und komme aus Chicago.", "Freut mich! Herzlich willkommen im Team.", "Wie heißen Sie? Woher kommen Sie?", "Ich bin Analyst in der Finanzabteilung."], "write": {"task": "You are new at a company. Write a short e-mail to your team (about 30 words). Include:", "points": ["who you are and where you're from", "your job and department", "one question for the team"], "model": "Liebes Team,\nich heiße David Miller und komme aus Chicago. Ich bin Analyst und arbeite ab Montag in der Finanzabteilung. Ich lerne Deutsch – bitte sprechen Sie langsam! Wann ist das Team-Meeting?\nViele Grüße\nDavid Miller"}, "speak": {"goethe": "Goethe A1 Sprechen, Teil 1: introducing yourself. In the exam you introduce yourself using these keywords:", "prompts": ["Name", "Alter", "Land", "Wohnort", "Sprachen", "Beruf", "Hobby"], "chat": "Deutsch-Kurs, Unit 1 (A1), Sprechen-Übung. Spiel bitte Herrn Weber aus der Finanzabteilung. Ich bin neu in der Firma. Stell mir die Fragen aus Goethe A1 Sprechen Teil 1 (Name, Alter, Land, Wohnort, Sprachen, Beruf, Hobby) – eine Frage nach der anderen, mit Sie. Korrigiere meine Fehler kurz auf Englisch nach jeder Antwort."}, "lesen": {"title": "Neu in Frankfurt", "en": "New in Frankfurt", "genre": "Office · 3-minute story", "sentences": [{"de": "Tom kommt aus Kanada.", "en": "Tom is from Canada."}, {"de": "Er wohnt jetzt in Frankfurt.", "en": "He lives in Frankfurt now."}, {"de": "Tom ist Analyst.", "en": "Tom is an analyst."}, {"de": "Er arbeitet bei einer Bank.", "en": "He works at a bank."}, {"de": "Heute ist sein erster Tag.", "en": "Today is his first day."}, {"de": "Im Büro sitzt eine Frau.", "en": "A woman is sitting in the office."}, {"de": "„Guten Morgen! Ich heiße Sara Yilmaz. Ich leite das Team.“", "en": "“Good morning! My name is Sara Yilmaz. I lead the team.”"}, {"de": "„Freut mich, Frau Yilmaz. Ich bin Tom Brown.“", "en": "“Nice to meet you, Ms. Yilmaz. I'm Tom Brown.”"}, {"de": "„Woher kommen Sie, Herr Brown?“", "en": "“Where are you from, Mr. Brown?”"}, {"de": "„Aus Toronto. Und Sie?“", "en": "“From Toronto. And you?”"}, {"de": "„Ich komme aus Köln, aber ich wohne schon zehn Jahre hier.“", "en": "“I'm from Cologne, but I've lived here for ten years.”"}, {"de": "Sara zeigt Tom das Team.", "en": "Sara shows Tom the team."}, {"de": "Das Team ist klein: drei Kollegen und zwei Kolleginnen.", "en": "The team is small: three male and two female colleagues."}, {"de": "Alle sagen „du“.", "en": "Everyone says “du”."}, {"de": "Tom ist überrascht.", "en": "Tom is surprised."}, {"de": "Sara lacht: „Hier sagen wir du. Ich bin Sara.“", "en": "Sara laughs: “Here we say du. I'm Sara.”"}], "gloss": {"jetzt": "now", "heute": "today", "erster": "first", "sitzt": "is sitting", "leite": "lead (I lead)", "schon": "already (here: for)", "jahre": "years", "zeigt": "shows", "klein": "small", "alle": "everyone, all", "sagen": "say", "überrascht": "surprised", "lacht": "laughs", "köln": "Cologne"}, "qs": [{"q": "Tom kommt aus Deutschland.", "a": false, "why": "Er kommt aus Kanada (Toronto)."}, {"q": "Tom arbeitet bei einer Bank.", "a": true, "why": "„Er arbeitet bei einer Bank.“"}, {"q": "Sara leitet das Team.", "a": true, "why": "„Ich leite das Team.“"}, {"q": "Sara kommt aus Frankfurt.", "a": false, "why": "Sie kommt aus Köln. Sie wohnt in Frankfurt."}, {"q": "Im Team sagen alle „Sie“.", "a": false, "why": "Alle sagen „du“."}]}}, {"id": 2, "level": "A1", "full": true, "title": "Im Büro", "en": "At the office: things you have and need", "goals": ["Use two more sound shifts (p → pf/f, t → z/ss) to unlock new words", "Name office objects with the right article (der / die / das)", "Say what you have, need, or are looking for — and what you don't have"], "bruecke": {"intro": "Office German is full of English. Where it isn't, it's usually two simple words glued together. Here are two more sound shifts, then how compound words work.", "showSounds": false, "cognates": [{"de": "der Computer", "en": "computer", "g": "m"}, {"de": "der Laptop", "en": "laptop", "g": "m"}, {"de": "das Dokument", "en": "document", "g": "n"}, {"de": "das Passwort", "en": "password", "g": "n"}, {"de": "das System", "en": "system", "g": "n"}, {"de": "das Büro", "en": "office (bureau)", "g": "n"}, {"de": "das Programm", "en": "program", "g": "n"}, {"de": "die Software", "en": "software", "g": "f"}, {"de": "das Papier", "en": "paper", "g": "n"}, {"de": "das Telefon", "en": "telephone", "g": "n"}, {"de": "die E-Mail", "en": "e-mail", "g": "f"}, {"de": "das Problem", "en": "problem", "g": "n"}], "rules": [{"title": "English p → German pf or f", "how": "At the start of a word p often becomes pf. After a vowel it becomes f or ff.", "ex": [["apple", "der Apfel"], ["to help", "helfen"], ["pound", "das Pfund"]], "guess": [["ship", "das Schiff"], ["to sleep", "schlafen"], ["open", "offen"]]}, {"title": "English t → German z or ss", "how": "At the start of a word t often becomes z (said 'ts'). After a vowel it becomes ss or s.", "ex": [["ten", "zehn"], ["two", "zwei"], ["water", "das Wasser"]], "guess": [["to", "zu"], ["what", "was"], ["to eat", "essen"]]}], "extraTitle": "Compound words: the last word decides", "extra": [{"de": "der Bildschirm", "en": "Bild (picture) + der Schirm (screen) = monitor"}, {"de": "der Schreibtisch", "en": "schreiben (write) + der Tisch (table) = desk"}, {"de": "die Finanzabteilung", "en": "Finanz (finance) + die Abteilung (department)"}, {"de": "die Datenanalyse", "en": "Daten (data) + die Analyse (analysis)"}, {"de": "das Passwort", "en": "Pass + das Wort (word) — the gender comes from the last word"}]}, "vocab": [{"de": "das Büro", "en": "office", "g": "n"}, {"de": "der Schreibtisch", "en": "desk", "g": "m"}, {"de": "der Computer", "en": "computer", "g": "m"}, {"de": "der Laptop", "en": "laptop", "g": "m"}, {"de": "der Bildschirm", "en": "screen, monitor", "g": "m", "note": "Plural: die Bildschirme"}, {"de": "der Drucker", "en": "printer", "g": "m"}, {"de": "die Tastatur", "en": "keyboard", "g": "f"}, {"de": "das Handy", "en": "cell phone", "g": "n"}, {"de": "die Datei", "en": "file (digital)", "g": "f"}, {"de": "der Ordner", "en": "folder", "g": "m"}, {"de": "das Dokument", "en": "document", "g": "n"}, {"de": "der Bericht", "en": "report", "g": "m"}, {"de": "die Tabelle", "en": "spreadsheet, table", "g": "f"}, {"de": "das Passwort", "en": "password", "g": "n"}, {"de": "der Kuli", "en": "pen (short for Kugelschreiber)", "g": "m"}, {"de": "brauchen", "en": "to need", "g": "v"}, {"de": "suchen", "en": "to look for", "g": "v"}, {"de": "finden", "en": "to find", "g": "v", "note": "du findest, er findet"}, {"de": "drucken", "en": "to print", "g": "v"}, {"de": "Entschuldigung!", "en": "Excuse me!", "g": "x"}, {"de": "Kein Problem!", "en": "No problem!", "g": "x"}], "dialog": {"title": "Ich habe noch keinen Laptop", "en": "David asks Mr. Weber for help setting up.", "lines": [{"s": "M", "de": "Entschuldigung, Herr Weber. Ich habe noch keinen Laptop.", "en": "Excuse me, Mr. Weber. I don't have a laptop yet."}, {"s": "W", "de": "Oh! Moment, ich frage die IT. Brauchen Sie auch einen Bildschirm?", "en": "Oh! One moment, I'll ask IT. Do you need a monitor too?"}, {"s": "M", "de": "Ja, bitte. Und ich brauche ein Passwort für das System.", "en": "Yes, please. And I need a password for the system."}, {"s": "W", "de": "Kein Problem. Der Drucker ist dort links.", "en": "No problem. The printer is over there on the left."}, {"s": "M", "de": "Danke! Und wo finde ich den Bericht für Oktober?", "en": "Thanks! And where do I find the report for October?"}, {"s": "W", "de": "Die Datei ist im Ordner Finanzen.", "en": "The file is in the Finanzen (finance) folder."}, {"s": "M", "de": "Super, vielen Dank!", "en": "Great, thank you very much!"}]}, "hoeren": {"intro": "A voicemail from IT. Listen twice, then answer.", "voice": "R", "text": "Guten Tag, Herr Miller, hier ist Peter Schulz von der IT. Ihr Laptop ist jetzt da. Sie bekommen auch einen Bildschirm und eine Tastatur. Das Passwort schicke ich Ihnen per E-Mail. Bitte kommen Sie heute um drei Uhr in die IT-Abteilung. Danke!", "qs": [{"q": "What has arrived?", "o": ["His laptop", "A printer", "A new phone"], "a": 0}, {"q": "What else will he get?", "o": ["A mouse and a printer", "A monitor and a keyboard", "A desk and a chair"], "a": 1}, {"q": "How will he get the password?", "o": ["By phone", "On paper", "By e-mail"], "a": 2}, {"q": "When should he come to IT?", "o": ["Today at 3:00", "Today at 2:30", "Tomorrow at 3:00"], "a": 0}], "diktat": ["Ich brauche einen Laptop.", "Wo ist der Drucker?", "Die Datei ist im Ordner.", "Haben Sie ein Passwort?"]}, "denken": [{"en": "I need", "de": "Ich brauche.", "note": "brauchen → ich brauche."}, {"en": "I need a laptop.", "de": "Ich brauche einen Laptop.", "note": "der Laptop → as the thing you need: einen."}, {"en": "I need a password.", "de": "Ich brauche ein Passwort.", "note": "das Passwort → stays ein."}, {"en": "I need a spreadsheet.", "de": "Ich brauche eine Tabelle.", "note": "die Tabelle → stays eine."}, {"en": "I don't have a laptop.", "de": "Ich habe keinen Laptop.", "note": "not a = kein, with the same ending as ein: keinen."}, {"en": "Do you have a pen? (formal)", "de": "Haben Sie einen Kuli?"}, {"en": "Where is the printer?", "de": "Wo ist der Drucker?", "note": "Subject (not object) → der stays der."}, {"en": "I'm looking for the report.", "de": "Ich suche den Bericht.", "note": "der Bericht as object → den. And no 'for': suchen already means look for."}], "grammar": [{"h": "1 · Every noun has a gender", "html": "<p><span class=\"g-m\"><b>der</b></span> (masculine), <span class=\"g-f\"><b>die</b></span> (feminine), <span class=\"g-n\"><b>das</b></span> (neuter). All plurals take <span class=\"g-p\"><b>die</b></span>. Learn every noun with its article — the colors on the flashcards help.</p>\n     <p class=\"small\">Useful patterns: nouns ending in <b>-ung, -ion, -heit, -keit</b> are <span class=\"g-f\">die</span> (die Abteilung). Ending in <b>-chen</b> (always) and <b>-ment</b> (usually) are <span class=\"g-n\">das</span> (das Dokument). Tools ending in <b>-er</b> are usually <span class=\"g-m\">der</span> (der Drucker, der Computer). In compounds, the <b>last</b> word decides.</p>"}, {"h": "2 · a / an and not a: ein, kein", "html": "<table class=\"tb\"><tr><th></th><th>the</th><th>a</th><th>no / not a</th></tr>\n     <tr><td class=\"g-m\">masc.</td><td>der</td><td>ein</td><td>kein</td></tr>\n     <tr><td class=\"g-f\">fem.</td><td>die</td><td>eine</td><td>keine</td></tr>\n     <tr><td class=\"g-n\">neut.</td><td>das</td><td>ein</td><td>kein</td></tr>\n     <tr><td class=\"g-p\">plural</td><td>die</td><td>—</td><td>keine</td></tr></table>"}, {"h": "3 · Accusative: only masculine changes", "html": "<p>The thing you have / need / look for is the direct object (accusative). Only <span class=\"g-m\">masculine</span> words change: <b>der → den, ein → einen, kein → keinen</b>.</p>\n     <div class=\"slots\"><span class=\"g-m\">Der Laptop</span><span class=\"v\">ist</span><span>neu.</span></div>\n     <div class=\"slots\"><span>Ich</span><span class=\"v\">brauche</span><span class=\"g-m\">einen Laptop.</span></div>\n     <div class=\"slots\"><span>Ich</span><span class=\"v\">habe</span><span class=\"g-m\">keinen Bildschirm.</span></div>\n     <p class=\"small\">English does this too, but only with pronouns: he → him. German does it with der → den.</p>"}, {"h": "4 · haben", "html": "<table class=\"tb\"><tr><td>ich habe</td><td>wir haben</td></tr><tr><td>du hast</td><td>ihr habt</td></tr><tr><td>er/sie/es hat</td><td>sie/Sie haben</td></tr></table>\n     <p class=\"small\">Sound shift again: have → haben (v → b).</p>"}], "mc": [{"q": "___ Drucker", "o": ["der", "die", "das"], "a": 0, "why": "Tool ending in -er → der Drucker."}, {"q": "___ Tabelle", "o": ["der", "die", "das"], "a": 1, "why": "die Tabelle."}, {"q": "___ Dokument", "o": ["der", "die", "das"], "a": 2, "why": "-ment → das Dokument."}, {"q": "Ich brauche ___ Laptop.", "o": ["ein", "eine", "einen"], "a": 2, "why": "der Laptop is masculine; as an object of brauchen → einen."}, {"q": "Haben Sie ___ Passwort?", "o": ["ein", "eine", "einen"], "a": 0, "why": "das Passwort is neuter; neuter doesn't change in the accusative → ein."}, {"q": "Using the t → z shift, „zehn“ means…", "o": ["ten", "zone", "tin"], "a": 0, "why": "t → z: ten → zehn."}], "gaps": [{"q": "Ich ____ eine Frage. (haben)", "a": ["habe"]}, {"q": "____ du einen Kuli? (haben)", "a": ["Hast"]}, {"q": "Ich suche ____ Bericht. (the — der Bericht)", "a": ["den"]}, {"q": "Das ist ____ Problem. (no — das Problem)", "a": ["kein"]}, {"q": "Wir brauchen zwei ____. (plural of Bildschirm)", "a": ["Bildschirme"]}], "builder": [{"w": ["Ich", "brauche", "einen", "Laptop."], "a": ["Ich brauche einen Laptop."], "en": "I need a laptop."}, {"w": ["Wo", "ist", "der", "Drucker?"], "a": ["Wo ist der Drucker?"], "en": "Where is the printer?"}, {"w": ["Ich", "habe", "keinen", "Bildschirm."], "a": ["Ich habe keinen Bildschirm."], "en": "I don't have a monitor."}], "tippen": ["Für das System brauche ich ein Passwort.", "Der Drucker ist im Büro.", "Wir brauchen zwei Bildschirme und eine Tastatur.", "Entschuldigung, wo finde ich den Bericht?"], "write": {"task": "Write a short message to the IT department (about 30 words). Include:", "points": ["you are new (which department)", "what you don't have yet", "what you need — and ask when they have time"], "model": "Sehr geehrte Damen und Herren,\nich bin neu in der Finanzabteilung. Ich habe noch keinen Laptop und ich brauche ein Passwort für das System. Wann haben Sie Zeit?\nMit freundlichen Grüßen\nDavid Miller"}, "speak": {"goethe": "Goethe A1 Sprechen, Teil 3: making requests and responding. In the exam you get picture cards and ask for things politely. Practice these:", "prompts": ["Haben Sie einen Kuli?", "Ich brauche ein Passwort.", "Wo ist der Drucker?", "Ja, gern. / Nein, leider nicht."], "chat": "Deutsch-Kurs, Unit 2 (A1), Sprechen-Übung wie Goethe A1 Sprechen Teil 3 (Bitten formulieren). Wir sind im Büro. Nenne mir jeweils einen Gegenstand (z. B. Drucker, Kuli, Passwort). Ich formuliere eine höfliche Bitte, du reagierst. Danach drehen wir die Rollen. Korrigiere meine Fehler kurz auf Englisch, besonders Artikel und Akkusativ."}, "lesen": {"title": "Wo ist der Laptop?", "en": "Where is the laptop?", "genre": "Office · 3-minute story", "sentences": [{"de": "Es ist Dienstag. Tom ist im Büro.", "en": "It's Tuesday. Tom is in the office."}, {"de": "Er sucht seinen Laptop.", "en": "He is looking for his laptop."}, {"de": "Der Laptop ist nicht auf dem Schreibtisch.", "en": "The laptop is not on the desk."}, {"de": "Er ist auch nicht im Schrank.", "en": "It's not in the cupboard either."}, {"de": "Tom fragt Sara: „Hast du meinen Laptop?“", "en": "Tom asks Sara: “Do you have my laptop?”"}, {"de": "„Nein, ich habe keinen Laptop. Ich habe nur ein Tablet.“", "en": "“No, I don't have a laptop. I only have a tablet.”"}, {"de": "Tom hat ein Problem. Er braucht den Bericht für den Chef.", "en": "Tom has a problem. He needs the report for the boss."}, {"de": "Der Bericht ist eine Datei auf dem Laptop.", "en": "The report is a file on the laptop."}, {"de": "Dann klingelt das Telefon.", "en": "Then the phone rings."}, {"de": "„Hallo Tom, hier ist Ben von der IT. Dein Laptop ist bei mir. Er bekommt ein Update.“", "en": "“Hi Tom, this is Ben from IT. Your laptop is here with me. It's getting an update.”"}, {"de": "Tom lacht. „Danke, Ben! Ich brauche ihn in zehn Minuten.“", "en": "Tom laughs. “Thanks, Ben! I need it in ten minutes.”"}, {"de": "„Kein Problem. Der Laptop ist gleich fertig.“", "en": "“No problem. The laptop will be ready in a moment.”"}], "gloss": {"sucht": "is looking for", "seinen": "his", "schrank": "cupboard", "auch": "also, either", "fragt": "asks", "meinen": "my", "nur": "only", "dann": "then", "klingelt": "rings", "bei": "with, at", "bekommt": "gets", "ihn": "it (him)", "gleich": "in a moment", "fertig": "ready, done"}, "qs": [{"q": "Tom sucht seinen Laptop.", "a": true, "why": "„Er sucht seinen Laptop.“"}, {"q": "Sara hat Toms Laptop.", "a": false, "why": "Sara hat keinen Laptop, nur ein Tablet."}, {"q": "Der Bericht ist eine Datei auf dem Laptop.", "a": true, "why": "„Der Bericht ist eine Datei auf dem Laptop.“"}, {"q": "Ben arbeitet in der IT.", "a": true, "why": "„Hier ist Ben von der IT.“"}, {"q": "Tom braucht den Laptop morgen.", "a": false, "why": "Er braucht ihn in zehn Minuten."}]}}, {"id": 3, "level": "A1", "full": true, "title": "Termine machen", "en": "Scheduling: times, days, meetings", "goals": ["Use three more sound shifts (d → t, k → ch, v/f → b)", "Tell the time — the official way and the everyday way", "Propose, accept, or decline a meeting time on the phone"], "bruecke": {"intro": "Time words are some of the clearest English–German pairs: day/Tag, week/Woche, half/halb. Three more sound shifts explain them all.", "showSounds": false, "cognates": [{"de": "die Minute", "en": "minute", "g": "f"}, {"de": "die Sekunde", "en": "second", "g": "f"}, {"de": "der Monat", "en": "month", "g": "m"}, {"de": "die Woche", "en": "week", "g": "f"}, {"de": "der Tag", "en": "day", "g": "m"}, {"de": "der Montag", "en": "Monday", "g": "m"}, {"de": "der Sonntag", "en": "Sunday", "g": "m"}, {"de": "der Mittwoch", "en": "Wednesday ('mid-week')", "g": "m"}, {"de": "der Kalender", "en": "calendar", "g": "m"}, {"de": "das Meeting", "en": "meeting", "g": "n"}, {"de": "die Uhr", "en": "clock; o'clock (cf. hour)", "g": "f"}, {"de": "halb", "en": "half", "g": "x"}], "rules": [{"title": "English d → German t", "how": "Where English has d, German often has t.", "ex": [["day", "der Tag"], ["good", "gut"], ["word", "das Wort"]], "guess": [["to drink", "trinken"], ["bed", "das Bett"], ["door", "die Tür"]]}, {"title": "English k / c → German ch", "how": "After a vowel, English k often becomes German ch.", "ex": [["to make", "machen"], ["book", "das Buch"], ["week", "die Woche"]], "guess": [["to cook", "kochen"], ["milk", "die Milch"], ["to speak", "sprechen"]]}, {"title": "English v / f → German b", "how": "In the middle of a word, English v or f often matches German b.", "ex": [["to have", "haben"], ["to give", "geben"], ["half", "halb"]], "guess": [["to live", "leben"], ["over", "über"], ["calf", "das Kalb"]]}], "extraTitle": "Small false friends you'll hear constantly", "extra": [{"de": "wer", "en": "who — not 'where'"}, {"de": "wo", "en": "where"}, {"de": "bald", "en": "soon — „Bis bald!“ = See you soon"}, {"de": "ich will", "en": "I want — not 'I will' (I will = ich werde)"}, {"de": "der Termin", "en": "appointment, slot — not 'term'"}]}, "vocab": [{"de": "der Termin", "en": "appointment", "g": "m"}, {"de": "die Besprechung", "en": "meeting", "g": "f"}, {"de": "das Meeting", "en": "meeting (common in business)", "g": "n"}, {"de": "die Einladung", "en": "invitation", "g": "f"}, {"de": "der Kalender", "en": "calendar", "g": "m"}, {"de": "die Woche", "en": "week", "g": "f"}, {"de": "heute", "en": "today", "g": "x"}, {"de": "morgen", "en": "tomorrow", "g": "x"}, {"de": "leider", "en": "unfortunately", "g": "x"}, {"de": "Zeit haben", "en": "to have time, be free", "g": "v"}, {"de": "passen", "en": "to suit, work for", "g": "v", "note": "Das passt mir. = That works for me."}, {"de": "anrufen", "en": "to call (phone) — separable", "g": "v", "note": "Ich rufe Sie an."}, {"de": "vorbereiten", "en": "to prepare — separable", "g": "v", "note": "Ich bereite die Zahlen vor."}, {"de": "absagen", "en": "to cancel — separable", "g": "v", "note": "Ich sage das Meeting ab."}, {"de": "verschieben", "en": "to postpone, move", "g": "v", "note": "Not separable: Wir verschieben das Meeting."}, {"de": "Um wie viel Uhr?", "en": "At what time?", "g": "x"}, {"de": "Auf Wiederhören!", "en": "Goodbye! (on the phone)", "g": "x"}], "dialog": {"title": "Am Telefon", "en": "Mr. Weber calls David to set up a budget meeting. Germans answer the phone with their surname.", "lines": [{"s": "M", "de": "Miller, guten Tag.", "en": "Miller, good afternoon."}, {"s": "W", "de": "Guten Tag, Herr Miller, hier ist Thomas Weber. Haben Sie am Dienstag Zeit? Wir brauchen ein Meeting zum Budget.", "en": "Hello Mr. Miller, this is Thomas Weber. Are you free on Tuesday? We need a meeting about the budget."}, {"s": "M", "de": "Am Dienstag habe ich leider keine Zeit. Geht es am Mittwoch?", "en": "Unfortunately I'm not free on Tuesday. Does Wednesday work?"}, {"s": "W", "de": "Ja, Mittwoch passt. Um wie viel Uhr?", "en": "Yes, Wednesday works. At what time?"}, {"s": "M", "de": "Um halb zehn?", "en": "At nine-thirty?"}, {"s": "W", "de": "Um halb zehn habe ich schon eine Besprechung. Geht es um zehn Uhr dreißig?", "en": "At nine-thirty I already have a meeting. Does ten-thirty work?"}, {"s": "M", "de": "Ja, das passt gut. Ich bereite die Zahlen vor.", "en": "Yes, that works well. I'll prepare the numbers."}, {"s": "W", "de": "Super. Ich schicke Ihnen eine Einladung. Auf Wiederhören!", "en": "Great. I'll send you an invitation. Goodbye!"}, {"s": "M", "de": "Auf Wiederhören, Herr Weber!", "en": "Goodbye, Mr. Weber!"}]}, "hoeren": {"intro": "Mr. Weber leaves a message. Listen for the day, the time, and the phone number — Goethe Hören loves numbers.", "voice": "W", "text": "Hallo Herr Miller, hier ist noch einmal Thomas Weber. Leider muss ich das Meeting am Mittwoch verschieben. Geht es am Donnerstag um Viertel nach zwei? Bitte rufen Sie mich an. Meine Nummer ist null sechs neun, zwei drei vier fünf sechs. Danke und bis bald!", "qs": [{"q": "Which meeting is being moved?", "o": ["Tuesday's", "Wednesday's", "Thursday's"], "a": 1}, {"q": "What new time does she suggest?", "o": ["Thursday 1:45", "Tuesday 2:15", "Thursday 2:15"], "a": 2}, {"q": "What should he do?", "o": ["Call her back", "Send an e-mail", "Come to her office"], "a": 0}, {"q": "Her number is…", "o": ["069 23456", "096 23456", "069 32456"], "a": 0}], "diktat": ["Am Montag habe ich keine Zeit.", "Um wie viel Uhr?", "Ich rufe Sie morgen an.", "Das passt mir gut."]}, "denken": [{"en": "I have time.", "de": "Ich habe Zeit.", "note": "No article: Zeit haben = to be free."}, {"en": "On Monday I have time.", "de": "Am Montag habe ich Zeit.", "note": "Time first → the verb stays in position 2 → subject after it."}, {"en": "Unfortunately I'm not free on Tuesday.", "de": "Am Dienstag habe ich leider keine Zeit.", "alt": ["Leider habe ich am Dienstag keine Zeit.", "Ich habe am Dienstag leider keine Zeit."], "note": "keine Zeit = no time. Several orders work as long as the verb is second."}, {"en": "At what time?", "de": "Um wie viel Uhr?"}, {"en": "At half past nine.", "de": "Um halb zehn.", "note": "halb zehn = halfway to ten = 9:30."}, {"en": "I'll call you tomorrow. (formal)", "de": "Ich rufe Sie morgen an.", "alt": ["Morgen rufe ich Sie an."], "note": "German uses the present tense for plans. The prefix an goes to the end."}, {"en": "Tomorrow I'll prepare the numbers.", "de": "Morgen bereite ich die Zahlen vor."}, {"en": "Does Wednesday work for you? (formal)", "de": "Passt Ihnen Mittwoch?", "alt": ["Passt es Ihnen am Mittwoch?", "Passt Ihnen der Mittwoch?"], "note": "Literally: suits you Wednesday?"}], "grammar": [{"h": "1 · Telling time", "html": "<p><b>Official (24-hour)</b> — used for meetings, trains, invitations: 14:30 = <i>vierzehn Uhr dreißig</i>. 9:15 = <i>neun Uhr fünfzehn</i>.</p>\n     <p><b>Everyday (12-hour)</b>:</p>\n     <table class=\"tb\"><tr><td>2:15</td><td>Viertel nach zwei</td></tr><tr><td>2:30</td><td><b>halb drei</b></td></tr><tr><td>2:45</td><td>Viertel vor drei</td></tr><tr><td>2:50</td><td>zehn vor drei</td></tr></table>\n     <div class=\"tip\"><b>Trap:</b> <i>halb drei</i> is 2:30, not 3:30 — think \"halfway to three\". This causes real missed meetings. When in doubt, confirm with the official form: „Also vierzehn Uhr dreißig?\"</div>"}, {"h": "2 · am, um, im", "html": "<table class=\"tb\"><tr><td><b>am</b> + day</td><td>am Montag, am Wochenende</td></tr><tr><td><b>um</b> + clock time</td><td>um 10 Uhr, um halb zehn</td></tr><tr><td><b>im</b> + month</td><td>im November</td></tr></table>\n     <p class=\"small\">Days (all <span class=\"g-m\">der</span>): Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag.</p>"}, {"h": "3 · Separable verbs", "html": "<p>Some verbs split: the prefix jumps to the end of the sentence. English does something similar: \"call <i>me</i> up\", \"put the meeting <i>off</i>\".</p>\n     <div class=\"slots\"><span>Ich</span><span class=\"v\">rufe</span><span>Sie morgen</span><span class=\"v\">an.</span></div>\n     <div class=\"slots\"><span>Ich</span><span class=\"v\">bereite</span><span>die Zahlen</span><span class=\"v\">vor.</span></div>\n     <div class=\"slots\"><span>Ich</span><span class=\"v\">sage</span><span>das Meeting</span><span class=\"v\">ab.</span></div>"}, {"h": "4 · Time first? The verb stays in position 2", "html": "<p>You can start a sentence with a time phrase — then the subject moves after the verb.</p>\n     <div class=\"slots\"><span>Am Dienstag</span><span class=\"v\">habe</span><span>ich</span><span>keine Zeit.</span></div>\n     <div class=\"slots\"><span>Morgen</span><span class=\"v\">rufe</span><span>ich</span><span>Sie an.</span></div>\n     <p class=\"small\">Not: <s>Am Dienstag ich habe…</s> — the most common English-speaker error.</p>"}], "mc": [{"q": "„halb drei“ is…", "o": ["3:30", "2:30", "3:00", "2:15"], "a": 1, "why": "halb drei = halfway to three = 2:30."}, {"q": "___ Montag habe ich Zeit.", "o": ["Um", "Am", "Im"], "a": 1, "why": "am + day."}, {"q": "Das Meeting beginnt ___ 9 Uhr.", "o": ["um", "am", "im"], "a": 0, "why": "um + clock time."}, {"q": "Ich rufe Sie morgen ___.", "o": ["auf", "an", "ab"], "a": 1, "why": "anrufen — the prefix an goes to the end."}, {"q": "„Viertel vor vier“ is…", "o": ["4:15", "3:15", "3:45", "4:45"], "a": 2, "why": "A quarter before four = 3:45."}, {"q": "Which sentence is correct?", "o": ["Leider ich habe am Freitag keine Zeit.", "Leider habe ich am Freitag keine Zeit."], "a": 1, "why": "leider takes position 1, so the verb (habe) must come next."}], "gaps": [{"q": "Ich bereite die Präsentation ____. (vorbereiten)", "a": ["vor"]}, {"q": "____ Mittwoch habe ich Zeit.", "a": ["Am"]}, {"q": "Das Meeting ist ____ 14 Uhr.", "a": ["um"]}, {"q": "Heute ist Montag. Morgen ist ____.", "a": ["Dienstag"]}, {"q": "Passt es Ihnen ____ Freitag?", "a": ["am"]}], "builder": [{"w": ["Am", "Montag", "habe", "ich", "keine", "Zeit."], "a": ["Am Montag habe ich keine Zeit.", "Ich habe am Montag keine Zeit."], "en": "I'm not free on Monday."}, {"w": ["Ich", "rufe", "Sie", "morgen", "an."], "a": ["Ich rufe Sie morgen an.", "Morgen rufe ich Sie an."], "en": "I'll call you tomorrow."}, {"w": ["Um", "wie", "viel", "Uhr", "beginnt", "das", "Meeting?"], "a": ["Um wie viel Uhr beginnt das Meeting?"], "en": "What time does the meeting start?"}], "tippen": ["Am Dienstag habe ich leider keine Zeit.", "Geht es am Mittwoch um halb zehn?", "Ich bereite die Zahlen für das Meeting vor.", "Auf Wiederhören und schönes Wochenende!"], "write": {"task": "You can't attend Tuesday's meeting. Write to Mr. Weber (about 30–40 words). Include:", "points": ["apologize: you can't come on Tuesday", "say why", "suggest a new day and time"], "model": "Lieber Herr Weber,\nleider kann ich am Dienstag nicht zum Meeting kommen. Ich habe da schon einen Termin mit einem Kunden. Geht es am Mittwoch um zehn Uhr? Ich bereite die Zahlen vor.\nViele Grüße\nDavid Miller"}, "speak": {"goethe": "Goethe A2 Sprechen, Teil 3: plan something together. In the exam you and a partner each have a different calendar and must find a time that works for both. Useful lines:", "prompts": ["Hast du / Haben Sie am … Zeit?", "Am … kann ich leider nicht.", "Wie wäre es mit … um …?", "Gut, dann treffen wir uns am … um …."], "chat": "Deutsch-Kurs, Unit 3 (A1→A2), Sprechen-Übung wie Goethe A2 Sprechen Teil 3 (gemeinsam etwas planen). Wir müssen einen Termin für ein Budget-Meeting nächste Woche finden. Erfinde deinen Kalender (Montag bis Freitag, mit einigen Terminen), aber zeig ihn mir nicht. Ich erfinde meinen. Wir verhandeln mit Sie, bis wir einen Termin finden. Danach korrigiere meine Fehler auf Englisch, besonders Wortstellung und Uhrzeiten."}, "lesen": {"title": "Halb zehn", "en": "Half past nine", "genre": "Office · 3-minute story", "sentences": [{"de": "Sara schreibt Tom eine E-Mail: „Hast du am Freitag Zeit? Wir brauchen ein Meeting zum Budget.“", "en": "Sara writes Tom an e-mail: “Are you free on Friday? We need a meeting about the budget.”"}, {"de": "Tom schaut in seinen Kalender.", "en": "Tom looks in his calendar."}, {"de": "Am Freitag hat er nur am Nachmittag einen Termin.", "en": "On Friday he only has an appointment in the afternoon."}, {"de": "Er antwortet: „Ja, Freitag passt. Um wie viel Uhr?“", "en": "He replies: “Yes, Friday works. At what time?”"}, {"de": "Sara schreibt: „Um halb zehn, in Raum drei.“", "en": "Sara writes: “At half past nine, in room three.”"}, {"de": "Tom denkt: „Halb zehn? Das ist zehn Uhr dreißig.“", "en": "Tom thinks: “Halb zehn? That's ten thirty.” (In British English “half ten” means 10:30.)"}, {"de": "Am Freitag kommt Tom um zehn Uhr dreißig in Raum drei.", "en": "On Friday Tom comes to room three at ten thirty."}, {"de": "Der Raum ist leer. Nur ein Kaffee steht auf dem Tisch.", "en": "The room is empty. Only a coffee is standing on the table."}, {"de": "Er ruft Sara an: „Sara, wo seid ihr?“", "en": "He calls Sara: “Sara, where are you all?”"}, {"de": "Sara lacht: „Tom, halb zehn ist neun Uhr dreißig! Das Meeting ist schon vorbei.“", "en": "Sara laughs: “Tom, halb zehn is nine thirty! The meeting is already over.”"}, {"de": "„Oh nein! Entschuldigung! Können wir das Meeting verschieben?“", "en": "“Oh no! Sorry! Can we move the meeting?”"}, {"de": "„Kein Problem. Wir machen es am Montag um neun Uhr. Ohne halb!“", "en": "“No problem. We'll do it on Monday at nine o'clock. Without halb!”"}], "gloss": {"schreibt": "writes", "schaut": "looks", "nachmittag": "afternoon", "antwortet": "answers, replies", "raum": "room", "denkt": "thinks", "leer": "empty", "steht": "stands", "tisch": "table", "ruft": "calls (anrufen)", "seid": "are (you all)", "vorbei": "over, finished", "können": "can", "ohne": "without", "dreißig": "thirty"}, "qs": [{"q": "Sara braucht ein Meeting zum Budget.", "a": true, "why": "„Wir brauchen ein Meeting zum Budget.“"}, {"q": "Am Freitag hat Tom am Morgen einen Termin.", "a": false, "why": "Er hat nur am Nachmittag einen Termin."}, {"q": "„Halb zehn“ ist neun Uhr dreißig.", "a": true, "why": "halb zehn = halfway to ten = 9:30."}, {"q": "Tom kommt zu früh.", "a": false, "why": "Er kommt zu spät: um 10:30, nicht um 9:30."}, {"q": "Das neue Meeting ist am Montag um neun Uhr.", "a": true, "why": "„Wir machen es am Montag um neun Uhr.“"}]}}, {"id": 4, "level": "A1", "title": "Telefon & E-Mail", "en": "Phone calls and formal e-mail", "focus": "Modal verbs: können, müssen, möchten · e-mail openings and closings"}, {"id": 5, "level": "A1", "title": "Zahlen & Finanzen", "en": "Numbers, money, percentages, dates", "focus": "Large numbers · Prozent · ordinals for dates (am 3. März)"}, {"id": 6, "level": "A1", "title": "Meetings & Kollegen", "en": "Running and joining a meeting", "focus": "Formal imperative · possessives (mein, Ihr, unser) · nicht vs. kein"}, {"id": 7, "level": "A2", "title": "Über die Arbeit berichten", "en": "Reporting what you did", "focus": "Perfect tense with haben / sein"}, {"id": 8, "level": "A2", "title": "Projekte & Aufgaben", "en": "Projects, tasks, deadlines", "focus": "Dative case · prepositions mit, bei, nach, von, zu"}, {"id": 9, "level": "A2", "title": "Zahlen präsentieren", "en": "Presenting data and trends", "focus": "Comparative / superlative · steigen, sinken · weil and dass clauses"}, {"id": 10, "level": "A2", "title": "Die Geschäftsreise", "en": "Business travel: train, hotel, directions", "focus": "Two-way prepositions (in, an, auf…) · Wo? vs. Wohin?"}, {"id": 11, "level": "A2", "title": "Probleme lösen", "en": "Problems, complaints, polite suggestions", "focus": "Polite Konjunktiv II (könnten Sie, ich würde) · deshalb, trotzdem"}, {"id": 12, "level": "A2", "title": "Bewerbung & Karriere", "en": "CV, application, job interview", "focus": "Simple past of sein, haben, modals · reflexive verbs (sich bewerben)"}];

/* The fixed order of every unit. pass = minimum % to pass; null = not graded. */
const STEPS = [
  {k:"bruecke",  t:"Brücke",    en:"Words you already know",  min:15, pass:70},
  {k:"woerter",  t:"Wörter",    en:"Vocabulary",              min:15, pass:75},
  {k:"lesen",    t:"Lesen",     en:"Story + true/false",      min:15, pass:80},
  {k:"hoeren",   t:"Hören",     en:"Listening + dictation",   min:20, pass:70},
  {k:"denken",   t:"Denken",    en:"Build sentences",         min:15, pass:75},
  {k:"grammatik",t:"Grammatik", en:"Grammar",                 min:10, pass:null},
  {k:"ueben",    t:"Üben",      en:"Exercises",               min:15, pass:80},
  {k:"tippen",   t:"Tippen",    en:"Typing",                  min:10, pass:90},
  {k:"schreiben",t:"Schreiben", en:"Writing (Claude grades)", min:20, pass:60},
  {k:"sprechen", t:"Sprechen",  en:"Speaking (Claude grades)",min:15, pass:60},
];
const UNIT_MIN = STEPS.reduce((a,s)=>a+s.min,0);

/* ================= STATE ================= */
let state={grades:{}, srs:{}, typing:{}, read:{}, xp:0, days:{}, stars:{}, hs:{}, settings:{engine:"auto", rate:1, voice:null}};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{const s=JSON.parse(lsGet("dfb3-state")||"null"); if(s&&s.grades){ state=Object.assign(state,s); state.settings=Object.assign({engine:"auto",rate:1,voice:null},s.settings||{}); state.days=s.days||{}; state.stars=s.stars||{}; state.hs=s.hs||{}; state.xp=s.xp||0; }}catch(e){}
function save(){ lsSet("dfb3-state",JSON.stringify(state)); }
const gkey=(u,k)=>`u${u}-${k}`;
function grade(u,k){ return state.grades[gkey(u,k)]||null; }
function stepStatus(u,s){
  if(s.pass===null) return state.read[gkey(u,s.k)]?"pass":"todo";
  const g=grade(u,s.k); if(!g) return "todo";
  return g.best>=s.pass?"pass":"fail";
}
function recordGrade(u,k,pct){
  const key=gkey(u,k), g=state.grades[key]||{best:0,attempts:0};
  g.last=pct; g.best=Math.max(g.best,pct); g.attempts++; g.date=new Date().toISOString().slice(0,10);
  state.grades[key]=g; save(); return g;
}
function unitPassed(u){ return STEPS.every(s=>stepStatus(u.id,s)==="pass"); }
function unitAvg(u){ const gs=STEPS.filter(s=>s.pass!==null).map(s=>grade(u.id,s.k)).filter(Boolean); return gs.length? Math.round(gs.reduce((a,g)=>a+g.best,0)/gs.length):null; }
function unitUnlocked(u){ const i=UNITS.findIndex(x=>x.id===u.id); return i===0 || unitPassed(UNITS[i-1]); }
function nextTask(){
  for(const u of UNITS.filter(x=>x.full)){
    if(unitPassed(u)) continue;
    const i=STEPS.findIndex(s=>stepStatus(u.id,s)!=="pass");
    return {u, i, s:STEPS[i], status:stepStatus(u.id,STEPS[i])};
  }
  return null;
}

/* ================= GAME LAYER: XP, daily goal, streak, stars, combo ================= */
const GOAL=150;
const todayKey=()=>{const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function xpToday(){ return state.days[todayKey()]||0; }
function streak(){ let n=0; const d=new Date(); if(!((state.days[todayKey()]||0)>=GOAL)) d.setDate(d.getDate()-1);
  for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if((state.days[k]||0)>=GOAL){ n++; d.setDate(d.getDate()-1);} else break; } return n; }
const LEVELS=["Anfänger","Neuling","Lernender","Fortgeschritten","Kollege","Teamleiter","Profi","Experte","Meister","Goethe-Held"];
function levelInfo(){ const x=state.xp; let L=0; while(400*(L+1)*(L+2)/2<=x) L++; const lo=400*L*(L+1)/2, hi=400*(L+1)*(L+2)/2; return {n:L+1, name:LEVELS[Math.min(L,LEVELS.length-1)], pct:Math.round(100*(x-lo)/(hi-lo)), toNext:hi-x}; }
let combo=0;
function addXP(n){ if(n<=0) return; const before=xpToday(), lvl=levelInfo().n; state.xp+=n; state.days[todayKey()]=before+n; save(); floatXP("+"+n+" XP");
  if(before<GOAL && before+n>=GOAL) setTimeout(()=>toast(`Tagesziel erreicht! 🔥 ${streak()}-day streak`),500);
  if(levelInfo().n>lvl) setTimeout(()=>toast(`Level ${levelInfo().n}: ${levelInfo().name}! 🎉`),900);
  const hb=document.getElementById("hud"); if(hb) hb.outerHTML=hudHTML(); }
function answered(ok){ if(ok){ combo++; addXP(10+(combo>=3?5:0)); if(combo>=3) showCombo(); } else { combo=0; hideCombo(); } }
function floatXP(t){ const e=document.createElement("div"); e.className="xpfloat"; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),1100); }
function showCombo(){ let c=document.getElementById("combo"); if(!c){ c=document.createElement("div"); c.id="combo"; document.body.appendChild(c);} c.textContent=`🔥 Combo ×${combo}`; c.classList.add("on"); clearTimeout(c._h); c._h=setTimeout(()=>c.classList.remove("on"),1800); }
function hideCombo(){ const c=document.getElementById("combo"); if(c) c.classList.remove("on"); }
function starsFor(pct,pass){ if(pass===null||pct==null) return 0; return pct>=100?3:pct>=90?2:pct>=pass?1:0; }
const starStr=n=>"★".repeat(n)+"☆".repeat(3-n);
function hudHTML(){ const L=levelInfo(), t=xpToday(), st=streak();
  return `<div class="hud" id="hud"><div class="hb"><span class="big">🔥 ${st}</span><span>day streak</span></div>
    <div class="hb grow"><div class="goalrow"><span>Today <b>${Math.min(t,GOAL)}/${GOAL} XP</b></span>${t>=GOAL?`<span class="ok-t">✓ goal</span>`:""}</div><div class="bar"><i style="width:${Math.min(100,Math.round(100*t/GOAL))}%"></i></div></div>
    <div class="hb"><span class="big">L${L.n}</span><span>${L.name}</span></div></div>`; }

/* ================= AUDIO =================
   1st choice: the device's own German voice (Edge natural voices, Google Deutsch in Chrome, Apple voices on iPhone).
   Fallback: the course's pre-recorded files. Roles: F narrator, W Herr Weber, M Herr Miller, R second speaker. */
const player=new Audio(); player.preload="auto";
let seq=[], seqCb=null, curBtn=null, VOICES=[], seqToken=0;
const FEMALE=/katja|amala|hedda|anna|helena|petra|marlene|vicki|seraphina|louisa|tanja|elke|gisela|klarissa|maja|ilse|sabine|leonie|jana|marie|google deutsch|ingrid|elsa/i;
const MALE=/conrad|killian|stefan|markus|martin|yannick|viktor|florian|bernd|christoph|ralf|kasper|hans|jonas|lukas|klaus|björn|bjorn/i;
const NOVELTY=/eloquence|grandma|grandpa|rocko|shelley|flo\b|eddy|reed|sandy|bad news|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|bahh/i;
function voiceScore(v){ let s=0, n=v.name; if(/natural|neural|online/i.test(n)) s+=50; if(/premium|enhanced|erweitert|verbessert/i.test(n)) s+=40; if(/google/i.test(n)) s+=35;
  if(v.lang==="de-DE"||v.lang==="de_DE") s+=10; else s+=2; if(NOVELTY.test(n)) s-=100; return s; }
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices().filter(v=>/^de([-_]|$)/i.test(v.lang)&&voiceScore(v)>-50).sort((a,b)=>voiceScore(b)-voiceScore(a)); }catch(e){ VOICES=[]; } }
if("speechSynthesis" in window){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged",()=>{ loadVoices(); const el=document.getElementById("audioInfo"); if(el) el.innerHTML=audioInfoHTML(); }); }catch(e){} }
function useDevice(){ const m=(state.settings||{}).engine||"auto"; if(m==="files") return false; return VOICES.length>0; }
function roleVoice(role){
  if(!VOICES.length) return {v:null,p:1};
  const chosen=state.settings.voice && VOICES.find(x=>x.name===state.settings.voice);
  const fem=VOICES.filter(v=>FEMALE.test(v.name)&&!MALE.test(v.name)), mal=VOICES.filter(v=>MALE.test(v.name));
  const narr=chosen||fem[0]||VOICES[0];
  if(role==="W") return mal[0]?{v:mal[0],p:1}:{v:narr,p:.85};
  if(role==="M") return mal[1]?{v:mal[1],p:1}:mal[0]?{v:mal[0],p:.88}:{v:narr,p:.75};
  if(role==="R") return fem[1]?{v:fem[1],p:1}:{v:narr,p:1.1};
  return {v:narr,p:1};
}
function speechText(t){ return t.replace(/\s*\/\s*/g,", ").replace(/[„“"‚‘]/g,"").replace(/…/g,"").trim(); }
function speakDevice(text,role,done){
  const rv=roleVoice(role), parts=speechText(text).match(/[^.!?]+[.!?]*/g)||[text], tok=++seqToken;
  const short=text.trim().split(/\s+/).length<=3, rate=(short?.78:.9)*(state.settings.rate||1);
  let i=0; const next=()=>{ if(tok!==seqToken) return; if(i>=parts.length){ done&&done(); return; }
    const u=new SpeechSynthesisUtterance(parts[i++].trim()); if(rv.v){u.voice=rv.v; u.lang=rv.v.lang;} else u.lang="de-DE";
    u.rate=rate; u.pitch=rv.p; u.onend=()=>setTimeout(next,short?250:120); u.onerror=()=>{ if(tok===seqToken) done&&done(); };
    speechSynthesis.speak(u); };
  next();
}
function ttsKey(t){return t.replace(/\s*\/\s*/g,", ").replace(/[„“"]/g,"").replace(/…/g,"").trim();}
function fileFor(text,v){ const t=ttsKey(text), r=v==="W"?"F":(v||"F"); return AUD[r+"|"+t]||AUD["F|"+t]||AUD["M|"+t]||AUD["R|"+t]||null; }
function setPlaying(b){ if(curBtn) curBtn.classList.remove("playing"); curBtn=b||null; if(curBtn) curBtn.classList.add("playing"); }
function play(text,v,btn,done){
  stopAudio(true); setPlaying(btn);
  const fin=()=>{ setPlaying(null); done&&done(); };
  if(useDevice()){ speakDevice(text,v||"F",fin); return; }
  const f=fileFor(text,v); if(!f){ fin(); return; }
  player.onended=fin; player.src=f; const p=player.play(); if(p&&p.catch) p.catch(fin);
}
function playSeq(items,onLine){ stopAudio(true); seq=items.slice(); seqCb=onLine; nextSeq(); }
function nextSeq(){
  const it=seq.shift();
  if(!it){ const cb=seqCb; seqCb=null; if(cb) cb(-1); setPlaying(null); return; }
  if(seqCb) seqCb(it.i);
  const go=()=>setTimeout(()=>{ if(seqCb) nextSeq(); }, it.gap||600);
  if(useDevice()){ speakDevice(it.t,it.v||"F",go); return; }
  const f=fileFor(it.t,it.v); if(!f){ go(); return; }
  player.onended=go; player.src=f; const p=player.play(); if(p&&p.catch) p.catch(go);
}
function stopAudio(silent){ seq=[]; seqToken++; try{player.pause(); player.onended=null;}catch(e){} try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} const cb=seqCb; seqCb=null; if(cb&&!silent) cb(-1); else if(cb) cb(-1); setPlaying(null); }
function spk(text,v){return `<button class="spk" aria-label="Anhören" data-say="${esc(text)}" data-v="${v||"F"}">🔊</button>`;}
function audioInfoHTML(){
  if(useDevice()){ const v=roleVoice("F").v; return `Using your device's voice: <b>${esc(v.name)}</b>.`; }
  if((state.settings.engine||"auto")==="files") return `Using the course recordings.`;
  return `<b>This browser has no German voice</b>, so the page is using the course's backup recordings, which sound robotic. For natural audio, open this page in <b>Microsoft Edge</b> (best) or <b>Chrome</b>, or on your iPhone.`;
}

/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200);}
function fold(s){return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");}
function normS(s){return fold(s.trim()).replace(/[.?!,;:–]/g," ").replace(/\s+/g," ").trim();}
function stripArt(s){return s.replace(/^(der|die|das)\s+/i,"");}
function shuffle(a){const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b;}
function gc(g){return {m:"g-m",f:"g-f",n:"g-n",p:"g-p"}[g]||"";}
function umlBar(){return `<div class="uml">${["ä","ö","ü","ß"].map(c=>`<button type="button" data-c="${c}">${c}</button>`).join("")}</div>`;}
function wireUml(root,input){ $$(".uml button",root).forEach(b=>b.onclick=()=>{const s=input.selectionStart??input.value.length; input.value=input.value.slice(0,s)+b.dataset.c+input.value.slice(input.selectionEnd??s); input.focus(); try{input.setSelectionRange(s+1,s+1);}catch(e){} input.dispatchEvent(new Event("input"));}); }
const TX=`type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"`;
async function copyText(text,box){ try{await navigator.clipboard.writeText(text); toast("Copied — paste it into a new Claude chat");}catch(e){ if(box){box.textContent=text; box.classList.add("on");} toast("Select the text below and copy it"); } }
function wordDiff(target,typed){
  const T=target.replace(/[.?!,;:]/g,"").split(/\s+/).filter(Boolean), Y=typed.replace(/[.?!,;:]/g,"").split(/\s+/).filter(Boolean);
  const n=T.length,m=Y.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) L[i][j]=fold(T[i])===fold(Y[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out=[],ok=0,soft=0;
  while(i<n||j<m){
    if(i<n&&j<m&&fold(T[i])===fold(Y[j])){ if(T[i]===Y[j]) out.push(`<span class="w-ok">${esc(Y[j])}</span>`); else {soft++; out.push(`<span class="w-case">${esc(Y[j])} → ${esc(T[i])}</span>`);} ok++; i++; j++; }
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){ out.push(`<span class="w-bad">${esc(Y[j])}</span>`); j++; }
    else { out.push(`<span class="w-miss">${esc(T[i])}</span>`); i++; }
  }
  return {html:out.join(" "), perfect:ok===n&&m===n&&!soft, close:ok===n&&m===n};
}

function showResult(u,i,pct){
  const s=STEPS[i], box=$("#result");
  if(s.pass===null){ state.read[gkey(u.id,s.k)]=true; save(); }
  else recordGrade(u.id,s.k,pct);
  const passed = s.pass===null || pct>=s.pass;
  const key=gkey(u.id,s.k), oldStars=state.stars[key]||0, newStars=starsFor(pct,s.pass);
  if(newStars>oldStars){ state.stars[key]=newStars; save(); }
  addXP(10 + Math.max(0,newStars-oldStars)*20);
  combo=0; hideCombo();
  const nextI=i+1<STEPS.length?i+1:null;
  const after = passed
    ? (nextI!==null? `<a class="btn primary" href="#unit-${u.id}-${nextI+1}" style="display:inline-block;text-decoration:none;margin-top:10px">Next: Step ${nextI+1} · ${STEPS[nextI].t} →</a>`
                   : `<a class="btn primary" href="#unit-${u.id}" style="display:inline-block;text-decoration:none;margin-top:10px">See unit result →</a>`)
    : `<p><b>Below the ${s.pass}% pass mark.</b> Redo this step now, or tomorrow before you do anything else in this unit. Don't move on: the next steps build on this one.</p><button class="btn primary" id="redo" style="margin-top:10px">Redo this step</button>`;
